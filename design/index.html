<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Design Pro Max 8.2</title>
<meta name="description" content="הדמיה מיידית ברמה מקצועית: בוחרים אריח מהחנות, והוא מונח על הרצפה ועל הקיר של החדר, בפרספקטיבה, באור ובהשתקפויות של הצילום.">
<meta name="theme-color" content="#0b0d10">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d10;--panel:rgba(14,16,20,.86);--line:rgba(255,255,255,.12);--text:#ece8df;--mute:#9a968d;--acc:#e2a84b;--acc2:#5fc4c9;
--body:"Heebo","Arial Hebrew",Arial,sans-serif;--display:"Secular One","Heebo",sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--body);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr)}
#app>*{min-width:0}
#top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:linear-gradient(var(--bg),rgba(11,13,16,.85));z-index:3}
#brand{display:flex;flex-direction:column;line-height:1.05;flex:1 1 auto;min-width:0}
#brand b{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.02em;direction:ltr;text-align:right;white-space:nowrap}
#brand small{color:var(--mute);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#shareBtn{order:2}
#roomSel{order:3;flex:1 0 100%;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#roomSel::-webkit-scrollbar{display:none}
#roomSel button{flex:0 0 auto;white-space:nowrap;min-height:34px;padding:0 11px;border:1px solid var(--line);border-radius:999px;font-size:13.5px;color:var(--mute);transition:border-color .2s,color .2s}
#roomSel button[aria-pressed="true"]{color:var(--text);border-color:var(--acc)}
@media (min-width:900px){#roomSel{order:0;flex:0 1 auto;margin-inline-start:auto}#shareBtn{order:0}#roomSel button{min-height:36px;padding:0 12px;font-size:14px}}
.ic{min-width:38px;min-height:38px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;color:var(--text);transition:border-color .2s,background .2s}
.ic[aria-pressed="true"]{border-color:var(--acc);color:var(--acc)}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#stage{position:relative;min-height:0;touch-action:none;background:#000;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#ov polygon{fill:rgba(226,168,75,.10);stroke:var(--acc);stroke-width:2;stroke-dasharray:8 6;filter:drop-shadow(0 0 6px rgba(226,168,75,.8));opacity:0;transition:opacity .35s}
#ov.on polygon{opacity:1}
#split{position:absolute;top:0;bottom:0;width:0;display:none;pointer-events:none}
#split.on{display:block}
#split::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.6)}
#split i{position:absolute;top:50%;left:-19px;width:38px;height:38px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;transform:translateY(-50%);box-shadow:0 2px 10px rgba(0,0,0,.5);font-style:normal;font-size:16px;letter-spacing:-2px}
#split b{position:absolute;top:14px;font-size:12px;color:#fff;text-shadow:0 1px 4px #000;font-weight:500}
#split b.l{right:10px} #split b.r{left:10px}
#hint{position:absolute;inset-inline:0;top:12px;text-align:center;pointer-events:none;color:#fff;font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.8);opacity:0;transition:opacity .4s}
#hint.on{opacity:.95}
#surf{position:absolute;inset-inline:0;bottom:12px;display:flex;justify-content:center;gap:8px;padding:0 12px;flex-wrap:wrap}
.sb{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px 0 8px;border-radius:999px;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);font-size:14px;color:var(--text);transition:border-color .2s}
.sb[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.sb .sw{width:22px;height:22px;border-radius:6px;background:#2a2d33 center/cover;border:1px solid var(--line)}
.sb small{color:var(--mute);font-size:12px}
.sb .x{margin-inline-start:4px;color:var(--mute);font-size:16px;line-height:1;padding:4px}
#tools{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:8px}
#tools .ic{background:var(--panel);backdrop-filter:blur(10px)}
#tray{background:var(--panel);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:3}
#filters{display:flex;gap:6px;overflow-x:auto;padding:2px 14px 8px;scrollbar-width:none}
#filters::-webkit-scrollbar{display:none}
#filters button{flex:0 0 auto;min-height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--mute);white-space:nowrap}
#filters button[aria-pressed="true"]{color:var(--text);border-color:var(--acc)}
#tiles{display:flex;gap:10px;overflow-x:auto;padding:0 14px 4px;scroll-snap-type:x proximity;scrollbar-width:none}
#tiles::-webkit-scrollbar{display:none}
.t{flex:0 0 auto;width:88px;display:flex;flex-direction:column;gap:5px;scroll-snap-align:start;text-align:right}
.t .im{width:88px;height:88px;border-radius:10px;background:#1a1d22 center/cover;border:2px solid transparent;transition:transform .15s,border-color .2s}
.t:active .im{transform:scale(.96)}
.t[aria-pressed="true"] .im{border-color:var(--acc)}
.t b{font-weight:500;font-size:12px;line-height:1.2;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;height:2.4em}
.t small{color:var(--mute);font-size:11px;direction:ltr;text-align:right}
.t.cam .im{display:grid;place-items:center;border:1px dashed var(--line);color:var(--mute)}
.t.cam .im svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.on{display:flex}
.sheet>div{width:min(560px,100%);background:#14171c;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;max-height:92vh;overflow:auto}
.sheet h2{margin:0;font-family:var(--display);font-weight:400;font-size:20px;color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row span{color:var(--mute);font-size:13px;min-width:64px}
.row button{min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;font-size:14px}
.row button[aria-pressed="true"]{border-color:var(--acc);color:var(--text)}
.row button[disabled]{opacity:.35}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--acc);color:var(--text);font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.p{background:var(--acc);color:#14110a;font-weight:600}
.mute{color:var(--mute);font-size:13px}
.cost{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:8px;font-size:14px}
.cost b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--acc)}
input[type=number],input[type=text]{font:inherit;color:var(--text);background:#0f1115;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;width:90px;text-align:center}
#favs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
#favs button{flex:0 0 auto;width:120px;height:76px;border-radius:10px;border:1px solid var(--line);background:#000 center/cover;position:relative;overflow:hidden}
#favs button span{position:absolute;inset-inline:0;bottom:0;font-size:11px;background:rgba(0,0,0,.6);padding:2px 6px;text-align:right}
#str{position:fixed;inset:0;background:#000;display:none;z-index:10;flex-direction:column}
#str.on{display:flex}
#strWrap{position:relative;flex:1;min-height:0;touch-action:none}
#strImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
#strSvg{position:absolute;inset:0;width:100%;height:100%}
#strSvg polygon{fill:rgba(226,168,75,.12);stroke:var(--acc);stroke-width:2}
#strSvg circle{fill:#fff;stroke:var(--acc);stroke-width:3}
#strBar{display:flex;gap:10px;align-items:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:#14171c;flex-wrap:wrap}
#mk{position:fixed;inset:0;background:#000;display:none;z-index:10;flex-direction:column}
#mk.on{display:flex}
#mkStep{margin:0;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:#14171c;font-size:15px;line-height:1.4}
#mkWrap{position:relative;flex:1;min-height:0;touch-action:none;overflow:hidden}
#mkImg{position:absolute;pointer-events:none}
#mkSvg{position:absolute;inset:0;width:100%;height:100%}
#mkSvg polygon{fill:rgba(226,168,75,.16);stroke:var(--acc);stroke-width:2}
#mkSvg circle{fill:#fff;stroke:var(--acc);stroke-width:3}
#mkSvg text{fill:#14110a;font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
#mkBar{display:flex;gap:10px;align-items:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:#14171c;flex-wrap:wrap}
#roomSel button.add{color:var(--acc);border-style:dashed}
#toast{position:fixed;left:50%;bottom:calc(190px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#14171c;border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:12}
#toast.on{opacity:1}
@media (min-width:900px){#brand b{font-size:19px} .t{width:96px} .t .im{width:96px;height:96px}}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="brand"><b>DESIGN PRO MAX 8.2</b><small>הדמיה מקצועית · קרמיקה בשאראת · cinemacome</small></div>
    <nav id="roomSel" aria-label="חדרים"></nav>
    <button class="ic" id="shareBtn" aria-label="לשמור ולשלוח"><svg viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M12 15V3M7 8l5-5 5 5"/></svg></button>
  </header>

  <section id="stage" aria-label="החדר">
    <canvas id="gl"></canvas>
    <svg id="ov" aria-hidden="true"><polygon id="ovPoly" points=""></polygon></svg>
    <div id="split"><b class="l">לפני</b><b class="r">אחרי</b><i>‹›</i></div>
    <div id="hint"></div>
    <div id="tools">
      <button class="ic" id="splitBtn" aria-label="לפני ואחרי" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 3v18"/></svg></button>
      <button class="ic" id="lightBtn" aria-label="תאורת ערב" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg></button>
      <button class="ic" id="resetBtn" aria-label="לנקות את הבחירות"><svg viewBox="0 0 24 24"><path d="M4 4v6h6M20 20v-6h-6M20 9A8 8 0 0 0 5.6 6.6L4 10M4 15a8 8 0 0 0 14.4 2.4L20 14"/></svg></button>
    </div>
    <div id="surf" role="tablist" aria-label="משטחים"></div>
  </section>

  <footer id="tray">
    <div id="filters" role="tablist" aria-label="סינון"></div>
    <div id="tiles" role="listbox" aria-label="אריחים"></div>
  </footer>
</div>

<div class="sheet" id="optSheet" role="dialog" aria-modal="true" aria-labelledby="optT">
  <div>
    <h2 id="optT">הנחה</h2>
    <div class="row"><span>סידור</span><button data-lay="0">ישר</button><button data-lay="1">בריקים</button><button data-lay="2">שליש</button><button data-lay="3">אדרה</button><button data-lay="4">אלכסון</button></div>
    <div class="row"><span>כיוון</span><button data-rot="0">לאורך</button><button data-rot="1">לרוחב</button></div>
    <div class="row"><span>פוגה</span><button data-gr="auto">בצבע האריח</button><button data-gr="light">בהירה</button><button data-gr="dark">כהה</button></div>
    <div class="row"><span>רוחב פוגה</span><button data-gw="1">1 מ״מ</button><button data-gw="2">2 מ״מ</button><button data-gw="3">3 מ״מ</button><button data-gw="5">5 מ״מ</button></div>
    <div class="row"><span>גימור</span><button data-fin="auto">לפי הקטלוג</button><button data-fin="matt">מט</button><button data-fin="satin">לאפטו</button><button data-fin="gloss">מבריק</button></div>
    <div class="row" id="hRow"><span>גובה חיפוי</span><button data-h="0">עד התקרה</button><button data-h="210">עד 210</button><button data-h="120">עד 120</button></div>
    <div class="row"><span>כמות</span><input type="number" id="qty" inputmode="decimal" min="0" step="0.5"> <span style="min-width:0">מ״ר</span></div>
    <div class="cost"><span class="mute" id="costNote">הערכה כולל 10% פחת</span><b id="cost">—</b></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" id="optClose">סגירה</button></div>
  </div>
</div>

<div class="sheet" id="shareSheet" role="dialog" aria-modal="true" aria-labelledby="shT">
  <div>
    <h2 id="shT">העיצוב שלכם</h2>
    <p class="mute" id="shSummary"></p>
    <div class="row"><input type="text" id="shName" placeholder="שם משפחה" style="width:100%;text-align:right"></div>
    <a class="btn p" id="shWa" href="#" target="_blank" rel="noopener">לשלוח לקרמיקה בשאראת בוואטסאפ</a>
    <div class="row"><button class="btn" id="shSave">לשמור להשוואה</button><button class="btn" id="shCopy">להעתיק קישור</button><button class="btn" id="shImg">להוריד תמונה</button></div>
    <div id="favs" aria-label="עיצובים שמורים"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" id="shClose">סגירה</button></div>
  </div>
</div>

<div id="str" role="dialog" aria-modal="true" aria-label="יישור אריח מצילום">
  <div id="strWrap"><img id="strImg" alt=""><svg id="strSvg"><polygon id="strPoly"></polygon><circle r="14" data-i="0"/><circle r="14" data-i="1"/><circle r="14" data-i="2"/><circle r="14" data-i="3"/></svg></div>
  <div id="strBar">
    <span class="mute">גררו את ארבע הפינות לפינות האריח</span>
    <label class="mute">רוחב <input type="number" id="strW" value="60" inputmode="numeric"></label>
    <label class="mute">אורך <input type="number" id="strH" value="60" inputmode="numeric"></label>
    <button class="btn" id="strCancel">ביטול</button>
    <button class="btn p" id="strOk">ליישר ולהניח</button>
  </div>
</div>
<div id="mk" role="dialog" aria-modal="true" aria-label="סימון החדר">
  <p id="mkStep"></p>
  <div id="mkWrap"><img id="mkImg" alt=""><svg id="mkSvg"><polygon id="mkPoly"></polygon><g id="mkH"></g></svg></div>
  <div id="mkBar">
    <label class="mute">רוחב הקיר שמול המצלמה <input type="number" id="mkW" value="4" step="0.1" min="1" inputmode="decimal"> מטר</label>
    <button class="btn" id="mkCancel">ביטול</button>
    <button class="btn" id="mkSkip">בלי קיר</button>
    <button class="btn p" id="mkOk">הבא</button>
  </div>
</div>
<input type="file" id="roomIn" accept="image/*" hidden>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<div id="toast" role="status"></div>

<script src="rooms.js?v=10"></script>
<script src="tiles.js?v=10"></script>

function geoCode(g){ var j=JSON.stringify(g); return btoa(unescape(encodeURIComponent(j))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
